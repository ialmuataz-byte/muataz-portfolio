<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-lang="ar">المعتز الصقري — ملف إبداعي</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@300;400;700&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════
   PROTOFILO THEME — AL MUATAZ AL SAQRI
   Black · White · Yellow (#FFE600)
══════════════════════════════════════ */
:root {
  --black:   #111111;
  --black2:  #1a1a1a;
  --black3:  #222222;
  --dark:    #2b2b2b;
  --mid:     #444444;
  --grey:    #888888;
  --light:   #f0f0f0;
  --white:   #ffffff;
  --yellow:  #FFE600;
  --yellow2: #f0d800;
  --red:     #e63030;
  --f-en-h:  'Bebas Neue', 'Barlow Condensed', sans-serif;
  --f-en-s:  'Barlow Condensed', sans-serif;
  --f-en-b:  'Barlow', sans-serif;
  --f-ar-h:  'Noto Naskh Arabic', serif;
  --f-ar-b:  'Noto Sans Arabic', sans-serif;
  --f-mono:  'IBM Plex Mono', monospace;
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior: smooth; }
body { background: var(--light); color: var(--black); overflow-x: hidden; font-family: var(--f-ar-b); }

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width:5px; }
::-webkit-scrollbar-track { background: var(--black); }
::-webkit-scrollbar-thumb { background: var(--yellow); border-radius:3px; }

/* ══ EDITABLE STATES ══ */
[contenteditable="true"] { outline:none; cursor:text; border-radius:2px; transition:background .15s; }
[contenteditable="true"]:hover { background:rgba(255,230,0,0.15) !important; }
[contenteditable="true"]:focus { background:rgba(255,230,0,0.25) !important; box-shadow:0 0 0 2px rgba(255,230,0,0.5); }

/* ══ AUTH CONTROL PANEL ══ */
.auth-panel { position: fixed; top: 20px; left: 140px; z-index: 9999; font-family: var(--f-mono); }
.auth-trigger { background: var(--black); color: var(--yellow); border: 2px solid var(--yellow); padding: 8px 14px; font-size: 10px; letter-spacing: 1px; cursor: pointer; text-transform: uppercase; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.auth-trigger:hover { background: var(--yellow); color: var(--black); }
.auth-box { display: none; position: absolute; top: 40px; left: 0; background: var(--black2); border: 2px solid var(--yellow); padding: 16px; width: 260px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); flex-direction: column; gap: 10px; }
.auth-box.show { display: flex; }
.auth-box input { background: var(--black); border: 1px solid var(--mid); color: var(--white); font-family: var(--f-mono); font-size: 12px; padding: 8px 12px; outline: none; width: 100%; }
.auth-box input:focus { border-color: var(--yellow); }
.auth-box button { background: var(--yellow); color: var(--black); border: none; padding: 8px; font-size: 10px; font-weight: 700; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; }
.auth-box button:hover { background: var(--yellow2); }
.auth-status-badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,230,0,0.1); color: var(--yellow); border: 1px solid rgba(255,230,0,0.3); padding: 6px 12px; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; display: none; pointer-events: none; }
.auth-status-badge.active { display: inline-flex; }

/* ══ LANG TOGGLE ══ */
.lang-wrap { position:fixed; top:20px; left:20px; z-index:9999; }
.lang-btn { display:flex; background:var(--black); border:2px solid var(--yellow); border-radius:0; overflow:hidden; cursor:pointer; font-family:var(--f-mono); font-size:10px; letter-spacing:2px; text-transform:uppercase; }
.lang-opt { padding:8px 16px; color:rgba(255,230,0,0.4); transition:all .2s; user-select:none; }
.lang-opt.active { background:var(--yellow); color:var(--black); font-weight:700; }

/* ══ EDIT HINT ══ */
.edit-hint { position:fixed; bottom:20px; right:20px; z-index:9998; background:var(--black); color:var(--yellow); font-family:var(--f-mono); font-size:9px; letter-spacing:2px; padding:8px 16px; opacity:0; pointer-events:none; transition:opacity .4s; text-transform:uppercase; border:1px solid var(--yellow); }
.edit-hint.show { opacity:1; }

/* ══════════════════════════════════════
   HERO — SPLIT: photo right, text left
══════════════════════════════════════ */
.hero-section {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 1fr 1fr;
  background: var(--black);
  position: relative;
  overflow: hidden;
}

.hero-left {
  background: var(--black2);
  padding: 0 60px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding-bottom: 80px;
  position: relative;
  z-index: 2;
}
.hero-dots {
  position: absolute;
  top: 60px; left: 60px;
  display: grid;
  grid-template-columns: repeat(8, 10px);
  gap: 8px;
  opacity: 0.25;
  pointer-events: none;
}
.hero-dots span { width:4px; height:4px; background:var(--grey); border-radius:50%; display:block; }

.hero-label {
  font-family: var(--f-mono);
  font-size: 10px;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: var(--grey);
  margin-bottom: 10px;
}
html[lang="ar"] .hero-label { text-align:right; }
html[lang="en"] .hero-label { text-align:left; }

.hero-pre {
  font-family: var(--f-en-b);
  font-size: 18px;
  font-weight: 300;
  color: var(--white);
  margin-bottom: 4px;
  opacity: 0.7;
}

html[lang="ar"] .hero-name-en { display:none; }
html[lang="en"] .hero-name-ar { display:none; }

.hero-name {
  line-height: 0.9;
  margin-bottom: 24px;
}
